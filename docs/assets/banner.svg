<svg width="1280" height="360" viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1210"/>
      <stop offset="1" stop-color="#0F1B17"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2EA043"/>
      <stop offset="1" stop-color="#39D98A"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1B2B25" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)" opacity="0.5"/>

  <!-- Wordmark -->
  <text x="56" y="76" fill="#F3F7F4" font-size="40" font-weight="700" letter-spacing="-0.5">CareerFlow</text>
  <text x="56" y="104" fill="#7FA491" font-size="16" letter-spacing="0.5">JOB SEARCH, RUN LIKE A PIPELINE</text>
  <rect x="56" y="120" width="64" height="4" rx="2" fill="url(#accentBar)"/>

  <!-- Kanban board: 4 columns -->
  <!-- Column positions -->
  <g font-size="13" font-weight="600" letter-spacing="0.5">
    <!-- Targeting -->
    <text x="56" y="168" fill="#9FB8AC">TARGETING</text>
    <!-- Applied -->
    <text x="368" y="168" fill="#9FB8AC">APPLIED</text>
    <!-- Interviewing -->
    <text x="680" y="168" fill="#9FB8AC">INTERVIEWING</text>
    <!-- Offer -->
    <text x="992" y="168" fill="#39D98A">OFFER</text>
  </g>

  <!-- column separators -->
  <line x1="336" y1="150" x2="336" y2="320" stroke="#1B2B25" stroke-width="1"/>
  <line x1="648" y1="150" x2="648" y2="320" stroke="#1B2B25" stroke-width="1"/>
  <line x1="960" y1="150" x2="960" y2="320" stroke="#1B2B25" stroke-width="1"/>

  <!-- Cards: Targeting -->
  <g filter="url(#soft)">
    <rect x="56" y="184" width="256" height="46" rx="8" fill="#132420" stroke="#233A32"/>
    <circle cx="76" cy="207" r="4" fill="#4C7A67"/>
    <text x="90" y="212" fill="#D8E6DF" font-size="14" font-weight="600">Figma</text>
    <text x="90" y="224" fill="#6C8B7C" font-size="11">Product Designer</text>
  </g>
  <g filter="url(#soft)">
    <rect x="56" y="242" width="256" height="46" rx="8" fill="#132420" stroke="#233A32"/>
    <circle cx="76" cy="265" r="4" fill="#4C7A67"/>
    <text x="90" y="270" fill="#D8E6DF" font-size="14" font-weight="600">Linear</text>
    <text x="90" y="282" fill="#6C8B7C" font-size="11">Backend Engineer</text>
  </g>

  <!-- Cards: Applied -->
  <g filter="url(#soft)">
    <rect x="368" y="184" width="256" height="46" rx="8" fill="#132420" stroke="#233A32"/>
    <circle cx="388" cy="207" r="4" fill="#C9A227"/>
    <text x="402" y="212" fill="#D8E6DF" font-size="14" font-weight="600">Vercel</text>
    <text x="402" y="224" fill="#6C8B7C" font-size="11">Full-Stack Engineer</text>
  </g>
  <g filter="url(#soft)">
    <rect x="368" y="242" width="256" height="46" rx="8" fill="#132420" stroke="#233A32"/>
    <circle cx="388" cy="265" r="4" fill="#C9A227"/>
    <text x="402" y="270" fill="#D8E6DF" font-size="14" font-weight="600">Notion</text>
    <text x="402" y="282" fill="#6C8B7C" font-size="11">Platform Engineer</text>
  </g>

  <!-- Cards: Interviewing -->
  <g filter="url(#soft)">
    <rect x="680" y="184" width="256" height="46" rx="8" fill="#15271F" stroke="#2A4A38"/>
    <circle cx="700" cy="207" r="4" fill="#39D98A"/>
    <text x="714" y="212" fill="#EAF6EF" font-size="14" font-weight="600">Stripe</text>
    <text x="714" y="224" fill="#6FA085" font-size="11">Round 2 · Thu 3:00 PM</text>
  </g>

  <!-- Card: Offer (highlighted) -->
  <g filter="url(#soft)">
    <rect x="992" y="184" width="232" height="52" rx="8" fill="#123321" stroke="#39D98A" stroke-width="1.5"/>
    <circle cx="1012" cy="210" r="4" fill="#39D98A"/>
    <text x="1026" y="215" fill="#F3FBF6" font-size="14" font-weight="700">Anthropic</text>
    <text x="1026" y="227" fill="#7FE3AC" font-size="11">Offer received 🎉</text>
  </g>

  <!-- Progress arrow motif -->
  <g stroke="#2A4A38" stroke-width="2" fill="none" opacity="0.8">
    <path d="M 320 300 L 1120 300" stroke-dasharray="2 8" stroke-linecap="round"/>
  </g>
  <path d="M 1112 293 L 1124 300 L 1112 307 Z" fill="#39D98A"/>

  <text x="56" y="336" fill="#5C7A6C" font-size="13">Companies · Applications · Interviews · Recruiters · Referrals · Follow-Ups</text>
</svg>
