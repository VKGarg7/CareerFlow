name: Keep Backend Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -s --retry 3 --retry-delay 10 --max-time 100 https://careerflow-backend-ravi.onrender.com/actuator/health
